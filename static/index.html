<div id="app">
  <div id="login-screen">
    <form id="login-form">
      <h1>mdnotes</h1>
      <input type="password" name="password" placeholder="password" required autocomplete="current-password">
      <button type="submit">Sign in</button>
      <p id="login-error" class="error"></p>
    </form>
  </div>

  <div id="dashboard" class="hidden">
    <header>
      <h1>mdnotes</h1>
      <div class="header-right">
        <button id="prefs-btn" class="prefs-btn" title="Preferences" aria-label="Preferences"><svg class="icon" aria-hidden="true"><use href="#icon-settings"></use></svg></button>
        <button id="logout-btn" class="btn-text">Sign out</button>
      </div>
    </header>
    <div class="dashboard-body">
      <div class="toolbar">
        <button id="new-note-btn" class="btn-primary">+ New</button>
      </div>
      <div id="tag-bar"></div>
      <div id="note-list"></div>
    </div>
  </div>

  <div id="prefs-modal" class="modal hidden">
    <div class="modal-backdrop"></div>
    <div class="modal-body">
      <h3>Preferences</h3>
      <label class="pref-row">
        <span>Auto Save</span>
        <input type="checkbox" id="pref-autosave" checked>
      </label>
      <label class="pref-row">
        <span>Hide Preview by default</span>
        <input type="checkbox" id="pref-hidepreview">
      </label>
      <label class="pref-row">
        <span>Hide Editor Toolbar</span>
        <input type="checkbox" id="pref-hidetoolbar">
      </label>
      <label class="pref-row">
        <span>Collapse Details by default</span>
        <input type="checkbox" id="pref-collapse">
      </label>
      <label class="pref-row">
        <span>Hide cursor position preview</span>
        <input type="checkbox" id="pref-hidecursor">
      </label>
      <label class="pref-row">
        <span>Dark Theme</span>
        <input type="checkbox" id="pref-theme">
      </label>
      <button id="prefs-close" class="btn-primary">Done</button>
    </div>
  </div>

  <div id="editor" class="hidden">
    <header>
      <button id="back-btn" class="btn-text"><svg class="icon" aria-hidden="true"><use href="#icon-arrow-left"></use></svg>Back</button>
      <div class="header-right">
        <span id="editor-status" class="status"></span>
        <button id="save-btn" class="btn-primary">Save</button>
        <button id="delete-btn" class="btn-text danger">Delete</button>
      </div>
    </header>
    <div class="editor-body">
      <div class="meta-pane">
        <button class="meta-toggle" type="button" title="Toggle details">
          <svg class="icon" aria-hidden="true"><use href="#icon-chevron-down"></use></svg>
          <span>Details</span>
        </button>
        <div class="meta-body">
          <label class="input-label" for="note-title">Title</label>
          <input type="text" id="note-title" placeholder="Note title" autocomplete="off">
          <label class="input-label" for="note-tags">Tags</label>
          <input type="text" id="note-tags" placeholder="tag1, tag2, tag3" autocomplete="off">
        </div>
      </div>
      <div class="editor-panels" id="editor-panels">
        <div class="panel panel-editor">
          <div class="panel-header">
            <span class="panel-label">Editor</span>
            <div class="panel-header-actions">
              <button class="panel-fs" data-fs="editor" title="Fullscreen editor">
                <svg class="icon" aria-hidden="true"><use href="#icon-maximize"></use></svg>
              </button>
              <button class="panel-toggle" data-panel="editor" title="Toggle editor">
                <svg class="icon" aria-hidden="true"><use href="#icon-minus"></use></svg>
              </button>
            </div>
          </div>
          <div class="fmt-bar" role="toolbar" aria-label="Formatting">
            <button type="button" data-fmt="bold" title="Bold (Ctrl+B)" aria-label="Bold"><svg class="icon" aria-hidden="true"><use href="#icon-bold"></use></svg></button>
            <button type="button" data-fmt="italic" title="Italic (Ctrl+I)" aria-label="Italic"><svg class="icon" aria-hidden="true"><use href="#icon-italic"></use></svg></button>
            <button type="button" data-fmt="strike" title="Strikethrough" aria-label="Strikethrough"><svg class="icon" aria-hidden="true"><use href="#icon-strikethrough"></use></svg></button>
            <span class="fmt-sep"></span>
            <button type="button" data-fmt="code" title="Inline code" aria-label="Inline code"><svg class="icon" aria-hidden="true"><use href="#icon-code"></use></svg></button>
            <button type="button" data-fmt="codeblock" title="Code block" aria-label="Code block"><svg class="icon" aria-hidden="true"><use href="#icon-braces"></use></svg></button>
            <span class="fmt-sep"></span>
            <button type="button" data-fmt="h1" title="Heading 1"><span class="fmt-label">H1</span></button>
            <button type="button" data-fmt="h2" title="Heading 2"><span class="fmt-label">H2</span></button>
            <button type="button" data-fmt="h3" title="Heading 3"><span class="fmt-label">H3</span></button>
            <button type="button" data-fmt="h4" title="Heading 4"><span class="fmt-label">H4</span></button>
            <span class="fmt-sep"></span>
            <button type="button" data-fmt="link" title="Link" aria-label="Link"><svg class="icon" aria-hidden="true"><use href="#icon-link"></use></svg></button>
            <button type="button" data-fmt="image" title="Image" aria-label="Image"><svg class="icon" aria-hidden="true"><use href="#icon-image"></use></svg></button>
            <span class="fmt-sep"></span>
            <button type="button" data-fmt="ul" title="Bullet list" aria-label="Bullet list"><svg class="icon" aria-hidden="true"><use href="#icon-list"></use></svg></button>
            <button type="button" data-fmt="ol" title="Numbered list" aria-label="Numbered list"><svg class="icon" aria-hidden="true"><use href="#icon-list-ordered"></use></svg></button>
            <button type="button" data-fmt="task" title="Task list" aria-label="Task list"><svg class="icon" aria-hidden="true"><use href="#icon-check-square"></use></svg></button>
            <span class="fmt-sep"></span>
            <button type="button" data-fmt="blockquote" title="Blockquote" aria-label="Blockquote"><svg class="icon" aria-hidden="true"><use href="#icon-quote"></use></svg></button>
            <button type="button" data-fmt="hr" title="Horizontal rule" aria-label="Horizontal rule"><svg class="icon" aria-hidden="true"><use href="#icon-minus"></use></svg></button>
            <button type="button" data-fmt="table" title="Insert table" aria-label="Insert table" aria-haspopup="dialog" aria-expanded="false"><svg class="icon" aria-hidden="true"><use href="#icon-table"></use></svg></button>
          </div>
          <textarea id="note-content" placeholder="Write markdown here..."></textarea>
        </div>
        <div class="panel panel-preview">
          <div class="panel-header">
            <span class="panel-label">Preview</span>
            <div class="panel-header-actions">
              <button class="panel-fs" data-fs="preview" title="Fullscreen preview">
                <svg class="icon" aria-hidden="true"><use href="#icon-maximize"></use></svg>
              </button>
              <button class="panel-toggle" data-panel="preview" title="Toggle preview">
                <svg class="icon" aria-hidden="true"><use href="#icon-minus"></use></svg>
              </button>
            </div>
          </div>
          <div id="preview" class="preview"></div>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="/marked.min.js"></script>
<script src="/app.js"></script>
</body>
</html>
